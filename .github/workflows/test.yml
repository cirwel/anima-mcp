name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run lint
        run: |
          ruff check .

      - name: Run type check
        run: |
          mypy

      - name: Run core anima tests
        run: |
          pytest tests/test_anima.py -v --tb=short

      - name: Run full test suite with coverage
        run: |
          pytest tests/ -v --tb=short --cov=anima_mcp --cov-report=term-missing

  heartbeat-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No dependencies: the runner's own Node is enough.
      - name: Run heartbeat receiver tests
        run: |
          node --version
          node --test cloudflare/heartbeat-worker/test/worker.test.mjs
